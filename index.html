<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>חגיגה משפחתית</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__blob backdrop__blob--1"></div>
    <div class="backdrop__blob backdrop__blob--2"></div>
    <div class="backdrop__blob backdrop__blob--3"></div>
    <div class="backdrop__grain"></div>
    <div class="backdrop__particle" style="left:8%; width:14px; height:14px; background:var(--coral); animation-duration:14s; animation-delay:0s; --drift-x:30px;"></div>
    <div class="backdrop__particle" style="left:20%; width:9px; height:9px; background:var(--gold); animation-duration:11s; animation-delay:-3s; --drift-x:-40px;"></div>
    <div class="backdrop__particle" style="left:35%; width:16px; height:16px; background:var(--pink); animation-duration:17s; animation-delay:-8s; --drift-x:50px;"></div>
    <div class="backdrop__particle" style="left:52%; width:10px; height:10px; background:var(--coral); animation-duration:13s; animation-delay:-5s; --drift-x:-25px;"></div>
    <div class="backdrop__particle" style="left:68%; width:13px; height:13px; background:var(--gold); animation-duration:16s; animation-delay:-11s; --drift-x:35px;"></div>
    <div class="backdrop__particle" style="left:80%; width:11px; height:11px; background:var(--pink); animation-duration:12s; animation-delay:-2s; --drift-x:-30px;"></div>
    <div class="backdrop__particle" style="left:92%; width:15px; height:15px; background:var(--coral); animation-duration:18s; animation-delay:-14s; --drift-x:20px;"></div>
  </div>

  <main id="app"></main>

  <div id="build-tag" aria-hidden="true">build #3</div>

  <script src="content/config.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/carousel.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
